mutation CaptureTransaction($input: CaptureTransactionInput!) {
  captureTransaction(input: $input) {
    transaction{
      id
      status
      paymentMethodSnapshot {
        ... on PayPalTransactionDetails {
          authorizationId
          captureId
          paymentId
          customField
          origin {
            type
          }
          transactionFee {
            value
            currencyCode
          }
          payer {
            firstName
            lastName
            phone
            email
            payerId
          }
        }
      }
    }
  }
}
